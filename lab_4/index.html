<!DOCTYPE html>
<html lang="uk-ua">
  <head>
    <meta charset="utf-8" />
    <title>Лаб. №4: головна</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Моя перша HTML-форма</h1>
    <form action="https://httpbin.org/post" method="POST">
      <p>
        <label for="name">Ім'я:</label>
        <input type="text" id="name" name="name" />
      </p>
      <p>
        <label for="birthdate">Дата народження:</label>
        <input type="date" id="birthdate" name="birthdate" />
      </p>
      <p>
        <label>
          Імейл:
          <input type="email" name="email" />
        </label>
      </p>
      <p>
        <label for="message">Повідомлення:</label>
        <textarea id="message" name="message" rows="4" cols="40"></textarea>
      </p>

      <p>Ваші улюблені напої?</p>
      <label>
        <input type="checkbox" name="drinks" value="tea" />
        Чай
      </label>
      <label>
        <input type="checkbox" name="drinks" value="coffee" />
        Кава
      </label>
      <label>
        <input type="checkbox" name="drinks" value="juice" />
        Сік
      </label>
      <label>
        <input type="checkbox" name="drinks" value="water" />
        Вода
      </label>

      <p>Моя національність</p>
      <label>
        <input type="radio" name="nationality" value="ukrainian" />
        Українець / українка
      </label>
      <label>
        <input type="radio" name="nationality" value="polish" />
        Поляк / полька
      </label>
      <label>
        <input type="radio" name="nationality" value="other" />
        Інша
      </label>

      <p>
        <button type="submit">Надіслати</button>
        <button type="reset">Очистити</button>
      </p>
    </form>

    <picture>
      <source
        media="(max-width: 467px)"
        srcset="https://picsum.photos/300/500"
      />
      <img
        src="https://picsum.photos/1000/400"
        alt="Демонстраційне зображення"
      />
    </picture>
  </body>
</html>
